name: Verify Opulent

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: opulent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opulent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPULENT_TEST_POSTGRES_URL: postgresql://postgres:test-password@localhost:5432/opulent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_system test_hosting test_postgres test_sms_sandbox -v
      - run: docker build -t opulent-system:verify .
